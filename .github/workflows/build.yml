name: Build Tkinter GUI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller requests beautifulsoup4 lxml Pillow selenium imagehash
    
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path ffmpeg.zip -DestinationPath .
        Copy-Item "ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "."
    
    - name: Download ChromeDriver
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/win64/chromedriver-win64.zip" -OutFile "chromedriver.zip"
        Expand-Archive -Path chromedriver.zip -DestinationPath .
        Copy-Item "chromedriver-win64\chromedriver.exe" -Destination "."
    
    - name: Build grab_images.exe
      run: |
        pyinstaller --onefile --console --name grab_images grab_images.py
    
    - name: Build video_downloader.exe
      run: |
        pyinstaller --onefile --console --add-binary "chromedriver.exe;." --name video_downloader video_downloader.py
    
    - name: Build GUI (MediaDownloader.exe)
      run: |
        pyinstaller --onefile --windowed --name MediaDownloader gui_launcher.py
    
    - name: Create Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path MediaDownloader
        Copy-Item dist\MediaDownloader.exe MediaDownloader\
        Copy-Item dist\grab_images.exe MediaDownloader\
        Copy-Item dist\video_downloader.exe MediaDownloader\
        Copy-Item ffmpeg.exe MediaDownloader\
        Copy-Item chromedriver.exe MediaDownloader\
        
        @"
        ═══════════════════════════════════════════════════════════
                    MEDIA DOWNLOADER v1.0
                       Tkinter GUI Edition
        ═══════════════════════════════════════════════════════════

        QUICK START:
        ------------
        1. Double-click MediaDownloader.exe
        2. Enter URL
        3. Select options (Images/Videos)
        4. Click RUN
        5. Done!

        FEATURES:
        ---------
        ✓ Download videos (MP4 + HLS conversion)
        ✓ Download images  
        ✓ Simple GUI interface
        ✓ No Python installation required
        ✓ Fully portable

        REQUIREMENTS:
        -------------
        - Windows 10/11
        - For JavaScript rendering: Chrome browser

        FILES:
        ------
        MediaDownloader.exe     Main GUI program
        grab_images.exe         Image downloader
        video_downloader.exe    Video downloader
        ffmpeg.exe             Video converter
        chromedriver.exe       JS rendering

        IMPORTANT:
        ----------
        Keep all files in the same folder!
        Do not separate MediaDownloader.exe from other files.

        USAGE:
        ------
        Double-click MediaDownloader.exe and follow the GUI.
        All other files work automatically in the background.

        ═══════════════════════════════════════════════════════════
        GitHub: github.com/rasitsahinn/media-downloader
        ═══════════════════════════════════════════════════════════
        "@ | Out-File -FilePath MediaDownloader\README.txt -Encoding UTF8
        
        Compress-Archive -Path MediaDownloader\* -DestinationPath MediaDownloader-Windows.zip
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-Windows
        path: MediaDownloader-Windows.zip
