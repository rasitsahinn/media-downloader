name: Build Single Unified EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller requests beautifulsoup4 lxml Pillow selenium imagehash
    
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path ffmpeg.zip -DestinationPath .
        Copy-Item "ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "."
        Write-Host "Done" -ForegroundColor Green
    
    - name: Build Single Unified EXE
      shell: pwsh
      run: |
        Write-Host "Building MediaDownloader.exe..." -ForegroundColor Cyan
        pyinstaller --onefile --windowed --name MediaDownloader --add-data "ffmpeg.exe;." --hidden-import grab_images --hidden-import video_downloader --collect-all selenium --collect-all requests --collect-all beautifulsoup4 --collect-all lxml --collect-all PIL --collect-all imagehash unified_gui.py
        Write-Host "Done" -ForegroundColor Green
    
    - name: Create Package
      shell: pwsh
      run: |
        Write-Host "Creating package..." -ForegroundColor Cyan
        New-Item -ItemType Directory -Path MediaDownloader -Force
        Copy-Item dist\MediaDownloader.exe MediaDownloader\
        
        $readme = "MEDIA DOWNLOADER v3.0`n"
        $readme += "All-in-One Edition`n"
        $readme += "`n"
        $readme += "QUICK START:`n"
        $readme += "1. Double-click MediaDownloader.exe`n"
        $readme += "2. Enter URL`n"
        $readme += "3. Select options`n"
        $readme += "4. Click RUN`n"
        $readme += "`n"
        $readme += "FEATURES:`n"
        $readme += "- Download videos (MP4 + HLS)`n"
        $readme += "- Download images`n"
        $readme += "- FFmpeg embedded`n"
        $readme += "- Single file - no dependencies!`n"
        $readme += "`n"
        $readme += "NOTE: Dailymotion not supported (no yt-dlp)`n"
        
        $readme | Out-File -FilePath MediaDownloader\README.txt -Encoding UTF8
        
        Compress-Archive -Path MediaDownloader\* -DestinationPath MediaDownloader-Unified.zip -Force
        
        $size = (Get-Item MediaDownloader-Unified.zip).Length / 1MB
        Write-Host "Package size: $([math]::Round($size, 2)) MB" -ForegroundColor Yellow
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-Unified
        path: MediaDownloader-Unified.zip
