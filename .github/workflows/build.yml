name: Build Tkinter GUI with Portable Chrome

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller requests beautifulsoup4 lxml Pillow selenium imagehash
    
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Write-Host "Downloading FFmpeg..." -ForegroundColor Cyan
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path ffmpeg.zip -DestinationPath .
        Copy-Item "ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination "."
        Write-Host "✓ FFmpeg ready" -ForegroundColor Green
    
    - name: Get Latest Chrome for Testing Version
      id: chrome-version
      shell: pwsh
      run: |
        Write-Host "Fetching latest Chrome for Testing version..." -ForegroundColor Cyan
        $json = Invoke-RestMethod -Uri "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
        $version = $json.channels.Stable.version
        Write-Host "Latest stable version: $version" -ForegroundColor Yellow
        echo "version=$version" >> $env:GITHUB_OUTPUT
    
    - name: Download Chrome for Testing (Portable)
      shell: pwsh
      run: |
        $version = "${{ steps.chrome-version.outputs.version }}"
        Write-Host "Downloading Chrome for Testing $version..." -ForegroundColor Cyan
        
        $chromeUrl = "https://storage.googleapis.com/chrome-for-testing-public/$version/win64/chrome-win64.zip"
        Write-Host "URL: $chromeUrl" -ForegroundColor Gray
        
        Invoke-WebRequest -Uri $chromeUrl -OutFile "chrome.zip"
        Expand-Archive -Path chrome.zip -DestinationPath .
        
        # Create browser directory
        New-Item -ItemType Directory -Path browser -Force
        
        # Move chrome.exe and dependencies
        Move-Item -Path "chrome-win64\*" -Destination "browser\" -Force
        
        # Verify
        if (Test-Path "browser\chrome.exe") {
            Write-Host "✓ Chrome portable ready" -ForegroundColor Green
            & "browser\chrome.exe" --version
        } else {
            Write-Host "✗ Chrome extraction failed!" -ForegroundColor Red
            exit 1
        }
    
    - name: Download ChromeDriver (Matching Version)
      shell: pwsh
      run: |
        $version = "${{ steps.chrome-version.outputs.version }}"
        Write-Host "Downloading ChromeDriver $version..." -ForegroundColor Cyan
        
        $driverUrl = "https://storage.googleapis.com/chrome-for-testing-public/$version/win64/chromedriver-win64.zip"
        Write-Host "URL: $driverUrl" -ForegroundColor Gray
        
        Invoke-WebRequest -Uri $driverUrl -OutFile "chromedriver.zip"
        Expand-Archive -Path chromedriver.zip -DestinationPath .
        Copy-Item "chromedriver-win64\chromedriver.exe" -Destination "."
        
        # Verify
        if (Test-Path "chromedriver.exe") {
            Write-Host "✓ ChromeDriver ready" -ForegroundColor Green
            & ".\chromedriver.exe" --version
        } else {
            Write-Host "✗ ChromeDriver extraction failed!" -ForegroundColor Red
            exit 1
        }
        
        Write-Host "`n✓ Chrome and ChromeDriver versions match!" -ForegroundColor Green
    
    - name: Build grab_images.exe
      run: |
        Write-Host "Building grab_images.exe..." -ForegroundColor Cyan
        pyinstaller --onefile --console --name grab_images grab_images.py
        Write-Host "✓ grab_images.exe built" -ForegroundColor Green
    
    - name: Build video_downloader.exe
      run: |
        Write-Host "Building video_downloader.exe..." -ForegroundColor Cyan
        pyinstaller --onefile --console --add-binary "chromedriver.exe;." --name video_downloader video_downloader.py
        Write-Host "✓ video_downloader.exe built" -ForegroundColor Green
    
    - name: Build GUI (MediaDownloader.exe)
      run: |
        Write-Host "Building MediaDownloader.exe (GUI)..." -ForegroundColor Cyan
        pyinstaller --onefile --windowed --name MediaDownloader gui_launcher.py
        Write-Host "✓ MediaDownloader.exe built" -ForegroundColor Green
    
    - name: Create Package with Portable Chrome
      shell: pwsh
      run: |
        Write-Host "Creating package..." -ForegroundColor Cyan
        
        # Create main directory
        New-Item -ItemType Directory -Path MediaDownloader -Force
        
        # Copy executables
        Copy-Item dist\MediaDownloader.exe MediaDownloader\
        Copy-Item dist\grab_images.exe MediaDownloader\
        Copy-Item dist\video_downloader.exe MediaDownloader\
        
        # Copy dependencies
        Copy-Item ffmpeg.exe MediaDownloader\
        Copy-Item chromedriver.exe MediaDownloader\
        
        # Copy portable Chrome
        Copy-Item -Path browser -Destination MediaDownloader\browser -Recurse -Force
        
        Write-Host "✓ Files copied" -ForegroundColor Green
        
        # Get versions for README
        $chromeVersion = & "browser\chrome.exe" --version
        $driverVersion = & ".\chromedriver.exe" --version
        
        # Create comprehensive README
        $readmeContent = @"
═══════════════════════════════════════════════════════════
                MEDIA DOWNLOADER v2.0
           Tkinter GUI Edition with Portable Chrome
═══════════════════════════════════════════════════════════

QUICK START:
------------
1. Double-click MediaDownloader.exe
2. Enter URL
3. Select options (Images/Videos)
4. Click RUN
5. Done!

FEATURES:
---------
✓ Download videos (MP4 + HLS + DASH conversion)
✓ Download images with filtering
✓ Dailymotion support (built-in)
✓ JavaScript rendering (Selenium)
✓ Network event capture
✓ Simple GUI interface
✓ Fully portable (no installation required)
✓ Chrome included (no external dependencies)

INCLUDED VERSIONS:
------------------
Chrome: $chromeVersion
ChromeDriver: $driverVersion
FFmpeg: Latest
Python: 3.11 (embedded)

REQUIREMENTS:
-------------
- Windows 10/11 (64-bit)
- No additional software needed
- Chrome is included (portable)

FOLDER STRUCTURE:
-----------------
MediaDownloader/
├── MediaDownloader.exe       Main GUI program
├── grab_images.exe           Image downloader
├── video_downloader.exe      Video downloader
├── ffmpeg.exe               Video converter
├── chromedriver.exe         Selenium WebDriver
└── browser/                 Portable Chrome (INCLUDED!)
    └── chrome.exe           Chrome binary

IMPORTANT:
----------
⚠ Keep all files together!
⚠ Do not move/delete any files
⚠ Do not separate executables from browser/ folder

The 'browser' folder contains a portable Chrome installation.
This ensures JavaScript rendering works out-of-the-box.

USAGE MODES:
------------
1. GUI Mode (Recommended):
   - Double-click MediaDownloader.exe
   - Follow on-screen instructions

2. Command Line (Advanced):
   
   Download videos:
   > video_downloader.exe "URL" --out ./videos
   
   With JavaScript rendering:
   > video_downloader.exe "URL" --out ./videos --render-js
   
   Download images:
   > grab_images.exe "URL" --out ./images

SUPPORTED SITES:
----------------
✓ Dailymotion (full support)
✓ Direct MP4/WebM videos
✓ HLS streams (.m3u8)
✓ DASH streams (.mpd)
✓ Most websites with <video> tags
✓ JavaScript-loaded videos (with --render-js)

TROUBLESHOOTING:
----------------
Q: "Chrome binary not found"
A: Make sure browser/ folder is in the same directory

Q: "ChromeDriver version mismatch"
A: This package includes matching versions - no action needed

Q: "No videos found"
A: Try with --render-js flag for JavaScript-heavy sites

Q: Videos won't download
A: Check if FFmpeg is in the same folder

NETWORK REQUIREMENTS:
---------------------
Internet connection required for:
- Downloading videos/images
- JavaScript rendering

No internet required for:
- Running the GUI
- Chrome/ChromeDriver operation

PERFORMANCE:
------------
- GUI: Instant startup
- Video extraction: 2-10 seconds per page
- HLS conversion: Depends on video length
- Image download: ~50-100 images/minute

PRIVACY:
--------
- No telemetry
- No data collection
- All processing done locally
- Chrome runs in isolated mode

UPDATES:
--------
Check for updates:
https://github.com/rasitsahinn/media-downloader/releases

═══════════════════════════════════════════════════════════
Built: $(Get-Date -Format 'yyyy-MM-dd HH:mm UTC')
Platform: Windows x64
Python: 3.11
GitHub: github.com/rasitsahinn/media-downloader
═══════════════════════════════════════════════════════════
"@
        
        $readmeContent | Out-File -FilePath MediaDownloader\README.txt -Encoding UTF8
        
        Write-Host "✓ README.txt created" -ForegroundColor Green
        
        # Create ZIP
        Compress-Archive -Path MediaDownloader\* -DestinationPath MediaDownloader-Windows.zip -Force
        
        # Get size
        $size = (Get-Item MediaDownloader-Windows.zip).Length / 1MB
        Write-Host "`n✓ Package created: MediaDownloader-Windows.zip ($([math]::Round($size, 2)) MB)" -ForegroundColor Green
        
        # Show contents
        Write-Host "`nPackage contents:" -ForegroundColor Cyan
        Get-ChildItem -Path MediaDownloader -Recurse -Name
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-Windows
        path: MediaDownloader-Windows.zip
        retention-days: 90
    
    - name: Build Summary
      shell: pwsh
      run: |
        Write-Host "`n" -NoNewline
        Write-Host "═══════════════════════════════════════════════════════════" -ForegroundColor Cyan
        Write-Host "                    BUILD SUCCESSFUL                        " -ForegroundColor Green
        Write-Host "═══════════════════════════════════════════════════════════" -ForegroundColor Cyan
        Write-Host "`nComponents built:" -ForegroundColor Yellow
        Write-Host "  ✓ MediaDownloader.exe (GUI)" -ForegroundColor Green
        Write-Host "  ✓ grab_images.exe" -ForegroundColor Green
        Write-Host "  ✓ video_downloader.exe" -ForegroundColor Green
        Write-Host "  ✓ FFmpeg" -ForegroundColor Green
        Write-Host "  ✓ Chrome (portable)" -ForegroundColor Green
        Write-Host "  ✓ ChromeDriver (matching version)" -ForegroundColor Green
        Write-Host "`nPackage: MediaDownloader-Windows.zip" -ForegroundColor Yellow
        Write-Host "Download from: Actions -> Artifacts" -ForegroundColor Yellow
        Write-Host "═══════════════════════════════════════════════════════════" -ForegroundColor Cyan
