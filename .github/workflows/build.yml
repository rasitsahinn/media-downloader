name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install pyinstaller requests beautifulsoup4 lxml Pillow selenium streamlit
    
    - name: Download FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path ffmpeg.zip
        Copy-Item "ffmpeg\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" "."
    
    - name: Create PyInstaller Spec
      shell: pwsh
      run: |
        @"
        # -*- mode: python ; coding: utf-8 -*-
        import sys
        from PyInstaller.utils.hooks import collect_all

        block_cipher = None

        datas = []
        binaries = []
        hiddenimports = []

        # Collect all Streamlit files
        tmp_ret = collect_all('streamlit')
        datas += tmp_ret[0]; binaries += tmp_ret[1]; hiddenimports += tmp_ret[2]

        # Add project files
        datas += [
            ('ui.py', '.'),
            ('grab_images.py', '.'),
            ('video_downloader.py', '.'),
        ]

        # Add FFmpeg binary
        binaries += [('ffmpeg.exe', '.')]

        # Additional hidden imports
        hiddenimports += [
            'streamlit.runtime.scriptrunner.magic_funcs',
            'streamlit.web.cli',
        ]

        a = Analysis(
            ['launcher.py'],
            pathex=[],
            binaries=binaries,
            datas=datas,
            hiddenimports=hiddenimports,
            hookspath=[],
            hooksconfig={},
            runtime_hooks=[],
            excludes=[],
            win_no_prefer_redirects=False,
            win_private_assemblies=False,
            cipher=block_cipher,
            noarchive=False,
        )

        pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

        exe = EXE(
            pyz,
            a.scripts,
            a.binaries,
            a.zipfiles,
            a.datas,
            [],
            name='MediaDownloader',
            debug=False,
            bootloader_ignore_signals=False,
            strip=False,
            upx=True,
            upx_exclude=[],
            runtime_tmpdir=None,
            console=True,
            disable_windowed_traceback=False,
            argv_emulation=False,
            target_arch=None,
            codesign_identity=None,
            entitlements_file=None,
        )
        "@ | Out-File -FilePath MediaDownloader.spec -Encoding UTF8
    
    - name: Build EXE
      run: |
        pyinstaller MediaDownloader.spec
    
    - name: Create Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path Release
        Copy-Item dist\MediaDownloader.exe Release\
        
        @"
        ═══════════════════════════════════════════════════════
                    MEDIA DOWNLOADER v1.0
        ═══════════════════════════════════════════════════════

        QUICK START:
        ------------
        1. Double-click MediaDownloader.exe
        2. Wait 5-10 seconds
        3. Browser opens automatically with the interface
        4. Paste URL and click Run!

        FEATURES:
        ---------
        ✓ Download videos (MP4 + HLS → MP4 conversion)
        ✓ Download images
        ✓ No Python installation required
        ✓ Fully portable

        TROUBLESHOOTING:
        ----------------
        "Multiple windows opening"
        → Fixed in this version!

        "Browser doesn't open"
        → Manually go to: http://localhost:8501

        "Antivirus blocks it"
        → This is a false positive (PyInstaller common issue)
        → Allow the file in your antivirus

        SYSTEM REQUIREMENTS:
        --------------------
        - Windows 10/11
        - 4GB RAM minimum
        - Internet connection (to download media)

        ═══════════════════════════════════════════════════════
        GitHub: github.com/rasitsahinn/media-downloader
        ═══════════════════════════════════════════════════════
        "@ | Out-File -FilePath Release\README.txt -Encoding UTF8
        
        Compress-Archive -Path Release\* -DestinationPath MediaDownloader-Windows.zip
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MediaDownloader-Windows
        path: MediaDownloader-Windows.zip
